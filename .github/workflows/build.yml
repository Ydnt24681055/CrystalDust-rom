name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libpng-dev pkg-config git

      - name: Build agbcc
        run: |
          rm -rf agbcc
          git clone https://github.com/pret/agbcc agbcc
          cd agbcc
          export PATH=/opt/devkitpro/devkitARM/bin:$PATH
          ./build.sh
          
          # 1. Create the exact folder structure the Makefile expects
          mkdir -p ../tools/agbcc/bin
          # 2. Copy the binary
          cp agbcc ../tools/agbcc/bin/agbcc
          # 3. Create a symlink in the root just in case the Makefile looks there
          ln -s tools/agbcc/bin/agbcc agbcc_bin

      - name: Build ROM
        run: |
          export PATH=/opt/devkitpro/devkitARM/bin:$PATH
          # Force the compiler variable directly
          make clean
          make AGOBJS=tools/agbcc/bin/agbcc -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'