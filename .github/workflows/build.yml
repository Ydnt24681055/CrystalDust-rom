name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Manually Install agbcc
        run: |
          # Remove the empty/broken folder
          rm -rf tools/agbcc
          # Clone the official agbcc source directly
          git clone https://github.com/pret/agbcc tools/agbcc
          # Build it
          make -C tools/agbcc
          # Ensure it's in the bin directory as expected by the ROM Makefile
          mkdir -p tools/agbcc/bin
          cp tools/agbcc/agbcc tools/agbcc/bin/agbcc

      - name: Build ROM
        run: |
          make clean
          make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'