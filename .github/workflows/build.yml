name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libpng-dev git

      - name: Build tools and ROM
        run: |
          # Ensure git recognizes the directory
          git config --global --add safe.directory /__w/CrystalDust-rom/CrystalDust-rom
          
          # Clean EVERYTHING to ensure new Makefile rules take effect
          make clean
          
          # Rebuild tools to incorporate any new Makefile logic
          make tools -j$(nproc)
          
          # Build the ROM
          make CrystalDust_legacy.gba -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: 'CrystalDust_legacy.gba'
          if-no-files-found: error
