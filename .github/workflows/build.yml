name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    env:
      DEVKITARM: /opt/devkitpro/devkitARM
      DEVKITPRO: /opt/devkitpro
      PATH: /opt/devkitpro/devkitARM/bin:/usr/local/bin:/usr/bin:/bin
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build agbcc
        run: |
          rm -rf agbcc
          git clone https://github.com/pret/agbcc agbcc
          cd agbcc
          # Build with the ARM toolchain
          ./build.sh
          # Install to the project folder
          mkdir -p ../tools/agbcc/bin
          cp agbcc ../tools/agbcc/bin/agbcc
          # Ensure it is executable
          chmod +x ../tools/agbcc/bin/agbcc

      - name: Build ROM
        run: |
          # 1. Clean
          make clean
          # 2. Build with V=1 to show exact compiler commands in the log
          # This will show us EXACTLY why it can't find stddef.h
          make V=1 -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'