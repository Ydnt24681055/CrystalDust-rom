name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force submodule initialization
        run: |
          git config --global --add safe.directory /__w/CrystalDust-rom/CrystalDust-rom
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Build tools
        run: |
          make -C tools

      - name: Build ROM
        run: |
          make clean
          make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'