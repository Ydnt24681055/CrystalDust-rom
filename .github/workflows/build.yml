name: Build ROM

on:
  push:
    branches:
      - progress
  pull_request:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libpng-dev git

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install agbcc
        run: |
          git clone https://github.com/pret/agbcc
          cd agbcc
          ./build.sh
          ./install.sh ..

      - name: Build tools
        env:
          GOFLAGS: "-buildvcs=false"
        run: |
          cd tools
          for d in */; do
            dir=$(echo "$d" | sed 's/\///')
            if [ -f "$dir/Makefile" ]; then
              make -C "$dir"
            fi
          done
          cd ..

      - name: Prepare Build Environment
        run: |
          # Diagnostics: Print current directory structure to find the missing file
          echo "Current directory structure:"
          find . -maxdepth 3 -name "ld_script.sed"
          
          # Fix: Locate and copy to where the Makefile expects it
          SED_PATH=$(find . -name "ld_script.sed" | head -n 1)
          if [ -n "$SED_PATH" ]; then
            echo "Moving $SED_PATH to root for build process..."
            cp "$SED_PATH" ./ld_script.sed
          else
            echo "CRITICAL: ld_script.sed not found!"
            exit 1
          fi

      - name: Build ROM
        run: |
          make clean
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
          if-no-files-found: error
