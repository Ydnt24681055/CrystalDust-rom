name: Build ROM

on:
  push:
    branches:
      - progress
  pull_request:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libpng-dev git

      - name: Install agbcc
        run: |
          git clone https://github.com/pret/agbcc
          cd agbcc
          ./build.sh
          ./install.sh ..

      - name: Build tools
        run: |
          make tools -j$(nproc)

      - name: Build ROM
        run: |
          # Configure safe directory to prevent build failures
          git config --global --add safe.directory /__w/CrystalDust-rom/CrystalDust-rom
          
          # Clean and compile
          make clean
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
          if-no-files-found: error
