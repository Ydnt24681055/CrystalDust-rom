name: Build ROM

on:
  push:
    branches:
      - progress
  pull_request:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libpng-dev git

      - name: Install agbcc
        run: |
          git clone https://github.com/pret/agbcc
          cd agbcc
          ./build.sh
          ./install.sh ..

      - name: Build tools
        run: |
          cd tools
          for d in */; do
            dir=$(echo "$d" | sed 's/\///')
            if [ -f "$dir/Makefile" ]; then
              make -C "$dir"
            fi
          done

      - name: Verify and Prepare Build
        run: |
          git submodule update --init --recursive
          # If ld_script.sed is missing, this diagnostic will catch it
          if [ ! -f "ld_script.sed" ]; then
            echo "Searching for ld_script.sed..."
            find . -name "ld_script.sed" -exec cp {} . \;
          fi
          
          if [ ! -f "ld_script.sed" ]; then
            echo "CRITICAL: ld_script.sed not found!"
            exit 1
          fi

      - name: Build ROM
        run: |
          make clean
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
          if-no-files-found: error
