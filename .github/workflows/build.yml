name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libpng-dev pkg-config

      - name: Build agbcc
        run: |
          # This forces the build of the specific compiler tool needed for GBA
          make -C tools/agbcc
          # Copy it to a location where the root Makefile expects it
          mkdir -p tools/agbcc/bin
          cp tools/agbcc/agbcc tools/agbcc/bin/agbcc

      - name: Build ROM
        run: |
          make clean
          make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'