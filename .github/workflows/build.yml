name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Install the specific arm-none-eabi compiler and build tools
          sudo apt-get install -y build-essential libpng-dev pkg-config gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Build agbcc
        run: |
          # Use the agbcc files you added to the root
          cd agbcc
          chmod -R +x .
          ./build.sh
          # Place the binary where your Makefile expects it
          mkdir -p ../tools/agbcc/bin
          cp agbcc ../tools/agbcc/bin/agbcc

      - name: Build ROM
        run: |
          make clean
          make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'