name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    # Using a container that already has the necessary tools for GBA decompilation
    container: ghcr.io/pret/agbcc:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set safe directory
        run: |
          git config --global --add safe.directory /__w/CrystalDust-rom/CrystalDust-rom

      - name: Build ROM
        run: |
          make clean
          make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'