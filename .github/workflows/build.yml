name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libpng-dev pkg-config

      - name: Prepare agbcc
        run: |
          # 1. Force execution permissions on the entire agbcc folder
          # This fixes the 'Permission denied' error on move-if-change
          chmod -R +x agbcc/
          
          # 2. Build the compiler
          cd agbcc
          ./build.sh
          
          # 3. Ensure the binary is where the root Makefile expects it
          mkdir -p ../tools/agbcc/bin
          cp agbcc ../tools/agbcc/bin/agbcc

      - name: Build ROM
        run: |
          make clean
          make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'