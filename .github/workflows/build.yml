name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libpng-dev pkg-config git

      - name: Build agbcc
        run: |
          # Remove existing folder to ensure a clean state
          rm -rf agbcc
          # Clone the official compiler source
          git clone https://github.com/pret/agbcc agbcc
          
          # Build agbcc with the correct ARM toolchain path
          cd agbcc
          export PATH=/opt/devkitpro/devkitARM/bin:$PATH
          chmod +x build.sh
          ./build.sh
          
          # Create expected directory structure for the root Makefile
          mkdir -p ../tools/agbcc/bin
          cp agbcc ../tools/agbcc/bin/agbcc

      - name: Build ROM
        run: |
          # Ensure toolchain is in path for the main ROM build
          export PATH=/opt/devkitpro/devkitARM/bin:$PATH
          make clean
          make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'