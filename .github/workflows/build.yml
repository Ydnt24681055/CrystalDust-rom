name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libpng-dev pkg-config

      - name: Set safe directory
        run: |
          git config --global --add safe.directory /__w/CrystalDust-rom/CrystalDust-rom

      - name: Prepare agbcc
        run: |
          # agbcc is in the root, so we enter that directory
          cd agbcc
          # Ensure execution permissions
          chmod +x build.sh
          ./build.sh
          # Create the path that the root Makefile expects (tools/agbcc/bin)
          mkdir -p ../tools/agbcc/bin
          # Copy the binary where the ROM build system expects it
          cp agbcc ../tools/agbcc/bin/agbcc

      - name: Build ROM
        run: |
          make clean
          make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'