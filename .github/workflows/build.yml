name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt-get update
          # We add gcc-arm-none-eabi to ensure stddef.h is available
          apt-get install -y build-essential libpng-dev pkg-config gcc-arm-none-eabi

      - name: Set safe directory
        run: |
          git config --global --add safe.directory /__w/CrystalDust-rom/CrystalDust-rom

      - name: Build ROM
        run: |
          # Use the root Makefile as intended
          make clean
          make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'