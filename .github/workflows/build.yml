name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    env:
      DEVKITARM: /opt/devkitpro/devkitARM
      DEVKITPRO: /opt/devkitpro
      PATH: /opt/devkitpro/devkitARM/bin:/usr/local/bin:/usr/bin:/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build agbcc
        run: |
          rm -rf agbcc
          git clone https://github.com/pret/agbcc agbcc
          cd agbcc
          ./build.sh
          # Create and verify structure
          mkdir -p ../tools/agbcc/bin
          cp agbcc ../tools/agbcc/bin/agbcc
          # Copy headers which are often needed for linking
          cp -r include/* ../tools/agbcc/include/

      - name: Build ROM
        run: |
          make clean
          # Explicitly set the compiler path for the build process
          make AGOBJS=tools/agbcc/bin/agbcc -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'