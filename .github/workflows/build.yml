name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false # Disable default checkout to avoid ownership issues

      - name: Set safe directory and init submodules
        run: |
          git config --global --add safe.directory /__w/CrystalDust-rom/CrystalDust-rom
          git submodule update --init --recursive

      - name: Verify tools directory
        run: |
          echo "Listing contents of tools directory:"
          ls -F tools/

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libpng-dev pkg-config

      - name: Build tools
        run: |
          make -C tools

      - name: Build ROM
        run: |
          make clean
          make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'