name: Build ROM

on:
  push:
    branches:
      - progress
  pull_request:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libpng-dev git

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install agbcc
        run: |
          git clone https://github.com/pret/agbcc
          cd agbcc
          ./build.sh
          ./install.sh ..

      - name: Build tools
        env:
          GOFLAGS: "-buildvcs=false"
        run: |
          cd tools
          for d in */; do
            dir=$(echo "$d" | sed 's/\///')
            if [ -f "$dir/Makefile" ]; then
              echo "Building tool in $dir..."
              make -C "$dir"
            fi
          done

      - name: Build ROM
        run: |
          # Clean build to ensure scripts like ld_script.sed are handled fresh
          make clean
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
          if-no-files-found: error
