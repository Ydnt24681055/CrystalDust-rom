name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libpng-dev pkg-config

      - name: Build tools
        run: |
          # CrystalDust requires these tools to be built first
          make -C tools

      - name: Install agbcc
        run: |
          # This compiles the GBA C compiler from source
          ./build.sh --install-agbcc

      - name: Build ROM
        run: |
          # Explicitly move to the root of the project where the Makefile lives
          cd . 
          make clean
          make -j$(nproc)
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: *.gba