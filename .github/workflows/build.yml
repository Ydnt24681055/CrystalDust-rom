name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    env:
      DEVKITARM: /opt/devkitpro/devkitARM
      DEVKITPRO: /opt/devkitpro
      PATH: /opt/devkitpro/devkitARM/bin:/usr/local/bin:/usr/bin:/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libpng-dev pkg-config git

      - name: Build agbcc
        run: |
          # 1. Clean and fetch fresh source
          rm -rf agbcc
          git clone https://github.com/pret/agbcc agbcc
          
          # 2. Build with ARM toolchain
          cd agbcc
          ./build.sh
          
          # 3. Create full directory structure and copy files
          mkdir -p ../tools/agbcc/bin
          mkdir -p ../tools/agbcc/include
          cp agbcc ../tools/agbcc/bin/agbcc
          cp -r include/* ../tools/agbcc/include/

      - name: Build ROM
        run: |
          # 4. Clean and build with explicit tool path
          make clean
          make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'