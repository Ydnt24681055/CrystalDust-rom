name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    # This container includes the arm-none-eabi tools missing from your build
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libpng-dev pkg-config git

      - name: Prepare clean agbcc
        run: |
          rm -rf agbcc
          git clone https://github.com/pret/agbcc agbcc
          cd agbcc
          ./build.sh
          mkdir -p ../tools/agbcc/bin
          cp agbcc ../tools/agbcc/bin/agbcc

      - name: Build ROM
        run: |
          make clean
          make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'