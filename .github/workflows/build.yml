name: Build ROM

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt-get update
          # Including build-essential and gcc-arm-none-eabi provides the missing stddef.h
          apt-get install -y build-essential libpng-dev pkg-config gcc-arm-none-eabi

      - name: Set safe directory
        run: |
          git config --global --add safe.directory /__w/CrystalDust-rom/CrystalDust-rom

      - name: Build ROM
        run: |
          # Using the root Makefile to manage tool compilation
          make clean
          make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'